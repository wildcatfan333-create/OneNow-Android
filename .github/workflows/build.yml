name: Build OneNow Android AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unzip OneNow
        run: unzip -q OneNow-Android-v1.zip -d extracted

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > extracted/OneNow-Android-v1/gradle.properties
          echo "android.enableJetifier=true" >> extracted/OneNow-Android-v1/gradle.properties

      - name: Build Google Play AAB
        run: |
          cd extracted/OneNow-Android-v1
          gradle :app:bundleRelease

      - name: Save AAB
        uses: actions/upload-artifact@v4
        with:
          name: OneNow-Google-Play-AAB
          path: extracted/OneNow-Android-v1/app/build/outputs/bundle/release/app-release.aab
